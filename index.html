<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TeleBridge Admin</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="apple-touch-icon" href="/logo.svg">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TeleBridge">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <script>
        // Global error handler for debugging
        window.onerror = function(message, source, lineno, colno, error) {
            console.error('TeleBridge Error:', message, 'at', source, ':', lineno);
        };
    </script>
    <style>
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .light .glass {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
          width: 5px;
          height: 5px;
        }
        ::-webkit-scrollbar-track {
          background: transparent;
        }
        ::-webkit-scrollbar-thumb {
          background: rgba(148, 163, 184, 0.2);
          border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-thumb {
          background: rgba(51, 65, 85, 0.5);
        }
        ::-webkit-scrollbar-thumb:hover {
          background: rgba(37, 99, 235, 0.3);
        }
        .custom-scrollbar {
          scrollbar-width: thin;
          scrollbar-color: rgba(51, 65, 85, 0.5) transparent;
        }

        /* Animation Keyframes & Classes */
        @keyframes slide-in-from-left {
          from { transform: translateX(-2rem); opacity: 0; }
          to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slide-in-from-right {
          from { transform: translateX(2rem); opacity: 0; }
          to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slide-in-from-top {
          from { transform: translateY(-2rem); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fade-in {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        @keyframes zoom-in-95 {
          from { transform: scale(0.95); opacity: 0; }
          to { transform: scale(1); opacity: 1; }
        }
        
        .slide-in-from-top { animation: slide-in-from-top 0.5s ease-out forwards; }
        .slide-in-from-right-8 { animation: slide-in-from-right 0.3s ease-out forwards; }
        .slide-in-from-left-8 { animation: slide-in-from-left 0.3s ease-out forwards; }
        .fade-in { animation: fade-in 0.3s ease-out forwards; }
        .zoom-in-95 { animation: zoom-in-95 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 dark:bg-slate-950 dark:text-slate-100 light:bg-slate-50 light:text-slate-900">
    <div id="splash-screen" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; z-index: 9999; transition: opacity 0.5s ease;">
      <svg width="80" height="80" viewBox="0 0 512 512" style="animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;">
        <defs>
          <linearGradient id="bg-gradient-splash" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="50%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#db2777" />
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="128" fill="url(#bg-gradient-splash)" />
        <path d="M120 240 L240 290 L400 140 L270 320 L270 420 L320 340 Z" fill="#ffffff" />
        <circle cx="380" cy="140" r="16" fill="#ffffff" />
      </svg>
      <div style="margin-top: 24px; font-family: 'Inter', sans-serif; font-weight: 900; font-size: 24px; letter-spacing: -0.5px; color: white;">TeleBridge</div>
      <div style="margin-top: 8px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 2px; color: #94a3b8; text-transform: uppercase;">Loading Workspace...</div>
      <style>
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(0.95); } }
      </style>
    </div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
<script>
  // Hide splash screen when React mounts
  const splash = document.getElementById('splash-screen');
  const root = document.getElementById('root');
  
  const hideSplash = () => {
    if (splash) {
      splash.style.opacity = '0';
      setTimeout(() => splash.remove(), 500);
    }
  };

  const observer = new MutationObserver((mutations) => {
    if (root && root.innerHTML.trim().length > 0) {
      hideSplash();
      observer.disconnect();
    }
  });
  
  if (root) {
    observer.observe(root, { childList: true, subtree: true, characterData: true });
  }

  // Fallback: hide splash after 10 seconds anyway
  setTimeout(hideSplash, 10000);
</script>
</body>
</html>
